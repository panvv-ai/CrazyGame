name: crazygame

services:
  crazygame:
    build:
      context: .
    image: crazygame
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      TZ: Asia/Shanghai
      CRAZYGAME_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - crazygame_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s

volumes:
  crazygame_data:
    name: crazygame_data
