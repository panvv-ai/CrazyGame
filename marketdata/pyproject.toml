[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketdata"
version = "1.0.0"
description = "CrazyGame multi-market quotes and daily-line fallback engine"
requires-python = ">=3.10"
dependencies = ["httpx>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/marketdata"]
